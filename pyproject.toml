[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tsskb"
version = "2.0.0"
description = "Governed static content platform for the ALE Networking training portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1,<4",
  "Markdown>=3.7,<4",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
deploy = ["paramiko>=3.5,<4"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "types-Markdown>=3.7",
]

[project.scripts]
tsskb = "tsskb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tsskb"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tsskb"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
# 冻结的历史脚本（旧 1.x 构建器与一次性生成/补丁工具）不参与 lint
extend-exclude = [
  "tools/legacy",
  "extract2.py",
  "gen_panels.py",
  "gen_verified.py",
  "patch_build.py",
  "patch_nav.py",
  "patch_ux.py",
  "verify_v1.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 兼容垫片必须先 sys.path.insert 再 import，E402 是该模式固有形态
"build_site.py" = ["E402"]
"check_links.py" = ["E402"]
"deploy.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tsskb"]
exclude = ["tools/"]

[[tool.mypy.overrides]]
module = ["paramiko", "paramiko.*"]
ignore_missing_imports = true
