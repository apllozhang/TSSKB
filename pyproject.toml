[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tsskb"
version = "2.0.0"
description = "Governed static content platform for the ALE Networking training portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1,<4",
  "Markdown>=3.7,<4",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
deploy = ["paramiko>=3.5,<4"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "types-Markdown>=3.7",
]

[project.scripts]
tsskb = "tsskb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tsskb"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tsskb"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tsskb"]
exclude = ["tools/"]

[[tool.mypy.overrides]]
module = ["paramiko", "paramiko.*"]
ignore_missing_imports = true
