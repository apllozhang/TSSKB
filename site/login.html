<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a0533">
  <title>登录 — ALE Networking 技术培训</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/login.css">
  <script src="/assets/js/auth-config.js?v=3"></script>
  <script src="/assets/js/auth-core.js?v=3"></script>
</head>
<body class="login-page">
  <main class="login-root">
    <!-- 全屏轮播背景 -->
    <div class="login-carousel" id="login-carousel" aria-hidden="true">
      <div class="carousel-layer" style="background-image:url('/assets/img/carousel-1.jpg')"></div>
      <div class="carousel-layer" style="background-image:url('/assets/img/carousel-2.jpg')"></div>
      <div class="carousel-layer" style="background-image:url('/assets/img/carousel-3.jpg')"></div>
      <div class="carousel-layer" style="background-image:url('/assets/img/carousel-4.jpg')"></div>
      <div class="overlay-h"></div>
      <div class="overlay-v"></div>
      <div class="overlay-grain"></div>
      <div class="carousel-indicators">
        <span class="dot is-active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <div class="login-content">
      <!-- 左侧品牌区 -->
      <div class="login-brand anim-brand">
        <div class="brand-row">
          <div class="brand-mark">
            <img src="/assets/ale-logo-white.png" alt="Alcatel-Lucent Enterprise">
          </div>
          <span class="brand-name">ALE 技术培训平台</span>
        </div>

        <div class="brand-center">
          <h1 class="brand-title">
            TSSKB
            <br>
            <span class="brand-subtitle">技术培训知识库</span>
          </h1>

          <!-- 轮换文案 -->
          <div class="rotating-text">
            <div class="rotating-line-wrap"><div class="rotating-line" id="rotating-line"></div></div>
            <div class="rotating-chars" id="rotating-chars"></div>
            <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
          </div>
        </div>

        <div class="brand-footer">&copy; <span id="copyright-year"></span> ALE Training Services</div>
      </div>

      <!-- 右侧登录面板 -->
      <div class="login-panel">
        <div class="login-card-wrap">
          <div class="login-card anim-card">
            <div class="mobile-brand">
              <div class="inner">
                <div class="mini-mark">
                  <img src="/assets/ale-logo-white.png" alt="">
                </div>
                <span class="mini-name">TSSKB</span>
              </div>
            </div>

            <div class="card-heading">
              <h2>欢迎登录</h2>
              <p>请输入您的账号信息以访问知识库</p>
            </div>

            <form id="login-form" novalidate>
              <div class="field anim-field">
                <label for="username">用户名</label>
                <div class="input-wrap">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  <input id="username" name="username" type="text" placeholder="请输入用户名" autocomplete="username" autofocus>
                </div>
              </div>

              <div class="field anim-field">
                <label for="password">密码</label>
                <div class="input-wrap">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password">
                </div>
              </div>

              <div class="form-error anim-error" id="form-error" role="alert"></div>

              <button type="submit" class="login-btn anim-btn" id="login-btn">
                <span class="btn-shimmer"></span>
                <span id="login-btn-label">登 录</span>
              </button>
            </form>

            <div class="card-footer">TSSKB 知识库 - 仅授权用户访问</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/login.js?v=3" defer></script>
</body>
</html>
